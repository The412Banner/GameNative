name: Create tagged release (testkey-signed)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create empty local.properties
        run: touch local.properties

      - name: Generate AOSP testkey keystore
        run: |
          set -euo pipefail
          mkdir -p app/keystores
          BASE="https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security"
          curl -fsSL "$BASE/testkey.pk8?format=TEXT" | base64 -d > testkey.pk8
          curl -fsSL "$BASE/testkey.x509.pem?format=TEXT" | base64 -d > testkey.x509.pem
          # pk8 is unencrypted PKCS#8 DER -> convert to a PEM private key
          openssl pkcs8 -inform DER -nocrypt -in testkey.pk8 -out testkey.key
          # bundle cert + key into a PKCS#12 keystore (password is public on purpose)
          openssl pkcs12 -export \
            -in testkey.x509.pem -inkey testkey.key \
            -name testkey -out app/keystores/testkey.p12 \
            -passout pass:android
          rm -f testkey.pk8 testkey.key testkey.x509.pem
          keytool -list -keystore app/keystores/testkey.p12 -storetype PKCS12 -storepass android

      - name: Install Android SDK Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Build with Gradle
        run: ./gradlew :app:assembleLegacyRelease :app:assembleModernRelease -x lintVitalLegacyRelease -x lintVitalModernRelease -x lintVitalAnalyzeLegacyRelease -x lintVitalAnalyzeModernRelease

      - name: Stage APKs
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG="${{ github.sha }}"
          cp app/build/outputs/apk/legacy/release/app-legacy-release.apk "gamenative-$TAG.apk"
          cp app/build/outputs/apk/modern/release/app-modern-release.apk "gamenative-$TAG-modern.apk"

      - name: Verify testkey signatures
        run: |
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          [ -d "$BUILD_TOOLS_DIR" ] || BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          for apk in gamenative-*.apk; do
            echo "== $apk =="
            "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "$apk" | \
              grep -E "Verified using|Number of signers|certificate DN"
          done

      - name: Upload APKs for next job
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: gamenative-*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          append_body: true
          body: |
            > **Unofficial** community build. Signed with the public **AOSP testkey** (v1+v2+v3) — this is **not** an official GameNative key. You must uninstall any existing GameNative before installing, and these APKs grant no platform/system privileges.

            ## Downloads
            - **`gamenative-${{ github.ref_name }}.apk`** — Unofficial GameNative Legacy (Android 8–14). Recommended for most users.
            - **`gamenative-${{ github.ref_name }}-modern.apk`** — Unofficial GameNative Modern (Android 11+). **Not backwards compatible** — glibc not supported, external storage location changed.
          files: |
            gamenative-${{ github.ref_name }}.apk
            gamenative-${{ github.ref_name }}-modern.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
