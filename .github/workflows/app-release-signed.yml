name: Android CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install Android SDK Build Tools
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKMANAGER" --install "build-tools;34.0.0"

    - name: Build with Gradle
      run: ./gradlew :app:assembleLegacyRelease :app:assembleModernRelease

    - name: Stage APKs
      run: |
        cp app/build/outputs/apk/legacy/release/app-legacy-release.apk app-legacy-release.apk
        cp app/build/outputs/apk/modern/release/app-modern-release.apk app-modern-release.apk

    - name: Upload Legacy APK
      uses: actions/upload-artifact@v4
      with:
        name: app-legacy-release
        path: ${{ github.workspace }}/app-legacy-release.apk

    - name: Upload Modern APK
      uses: actions/upload-artifact@v4
      with:
        name: app-modern-release
        path: ${{ github.workspace }}/app-modern-release.apk
