name: Unofficial testkey release

# Builds the Legacy release APK with no secrets (release buildType is debug-signed),
# then re-signs it with the public AOSP testkey committed in the repo (v1+v2+v3) and
# publishes a prerelease. Triggered by pushing a tag like v1.0.1-unofficial-testkey.

on:
  push:
    tags:
      - "v*-unofficial-testkey"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create empty local.properties
        run: touch local.properties

      - name: Install Android SDK Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Build Legacy release APK (debug-signed, no secrets)
        run: ./gradlew :app:assembleLegacyRelease -x lintVitalLegacyRelease -x lintVitalAnalyzeLegacyRelease

      - name: Re-sign with AOSP testkey (v1+v2+v3)
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          [ -d "$BUILD_TOOLS_DIR" ] || BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG="${GITHUB_SHA::7}"
          IN=app/build/outputs/apk/legacy/release/app-legacy-release.apk
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "gamenative-$TAG.apk" \
            "$IN"
          echo "== signature =="
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "gamenative-$TAG.apk" | \
            grep -E "Verified using|Number of signers|certificate DN" || true

      - name: Upload APK for release job
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: gamenative-*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history + tags so we can diff against the previous unofficial tag.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./

      - name: Compute release title
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"; VER="${VER%-unofficial-testkey}"
          echo "title=Unofficial GameNative ${VER} - Manual LSFG DLL Picker" >> "$GITHUB_OUTPUT"

      # Builds RELEASE_BODY.md: fixed disclaimer/downloads + a collapsible
      # <details> "What's New" list of every commit since the previous
      # v*-unofficial-testkey tag. Fully automatic for future releases.
      - name: Build release body
        run: |
          set -euo pipefail
          CUR="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          PREV="$(git tag --sort=-creatordate -l 'v*-unofficial-testkey' | grep -vxF "$CUR" | head -n1 || true)"

          {
            echo "> **Unofficial** community build, signed with the public **AOSP testkey** (v2+v3 schemes). This is **not** an official GameNative key — the testkey is publicly known, so only install builds from a source you trust. On a normal device the testkey grants **no** platform/system privileges."
            echo ">"
            echo "> ✅ **Updates in place** over previous *unofficial testkey* builds (same key + package \`app.gamenative\`) — no need to uninstall."
            echo "> ⚠️ Coming from the **official GameNative** (or any differently-signed build)? Android will block the update with a signature mismatch — **uninstall that one first**."
            echo ""
          } > RELEASE_BODY.md

          if [ -n "$PREV" ]; then
            N="$(git rev-list --no-merges --count "${PREV}..HEAD")"
            echo "This build keeps the **manual LSFG \`Lossless.dll\` picker** (this fork's feature) and includes **${N} commit(s)** since \`${PREV}\`." >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "<details>" >> RELEASE_BODY.md
            echo "<summary><b>What's New</b> (click to expand)</summary>" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "</details>" >> RELEASE_BODY.md
          else
            echo "This build keeps the **manual LSFG \`Lossless.dll\` picker** (this fork's feature)." >> RELEASE_BODY.md
          fi

          {
            echo ""
            echo "## Downloads"
            echo "- **\`gamenative-${CUR}.apk\`** — Unofficial GameNative Legacy (Android 8–14). Recommended for most users."
          } >> RELEASE_BODY.md

          if [ -n "$PREV" ]; then
            echo "" >> RELEASE_BODY.md
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV}...${CUR}" >> RELEASE_BODY.md
          fi

          echo "----- RELEASE_BODY.md -----"
          cat RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: true
          body_path: RELEASE_BODY.md
          files: |
            gamenative-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
